name: Screenshots

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "BlueTools/**"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shoot:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Pick simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys, re
          data = json.load(sys.stdin)["devices"]
          phones = [d for runtime, items in data.items() if "iOS" in runtime for d in items if d["name"].startswith("iPhone")]
          pick = next((d for d in phones if re.fullmatch(r"iPhone \d+ Pro", d["name"])), phones[0])
          print(pick["udid"])
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"

      - name: Build for simulator
        run: |
          xcodegen generate
          xcodebuild \
            -project BlueTools.xcodeproj \
            -scheme BlueTools \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1 || { grep -E "error:" build.log; tail -n 30 build.log; exit 1; }

      - name: Take screenshots
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/BlueTools.app
          BUNDLE=io.github.onlinekot.bluetools
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          xcrun simctl install "$UDID" "$APP"
          mkdir -p docs/screenshots
          shoot() {
            xcrun simctl ui "$UDID" appearance "$2"
            xcrun simctl terminate "$UDID" "$BUNDLE" || true
            xcrun simctl launch "$UDID" "$BUNDLE" -demo -screen "$1"
            sleep 6
            xcrun simctl io "$UDID" screenshot "docs/screenshots/$3.png"
            sips -Z 1200 "docs/screenshots/$3.png" > /dev/null
          }
          shoot list light list
          shoot list dark list-dark
          shoot finder light finder
          shoot settings light settings
          ls -lh docs/screenshots

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Bez zmian"
          else
            git commit -m "Update screenshots"
            git push
          fi
